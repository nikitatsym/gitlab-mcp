# Upstream image pins. A floating tag turns an unrelated commit red the day
# upstream ships: 19.4.0 added a `?v=<updated_at>` cache buster to avatar URLs
# and broke CI on a docs-only change. Bump a pin deliberately, in its own
# commit. Override for a one-off check with the matching variable, e.g.
# GITLAB_CE_VERSION=19.3.2-ce.0 docker compose -f tests/docker-compose.yml up -d gitlab
services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_CE_VERSION:-19.4.0-ce.0}
    hostname: gitlab.test
    ports:
      - "8929:8929"
    environment:
      GITLAB_ROOT_PASSWORD: X9!Zq-Integration-Tkn42
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['initial_root_password'] = 'X9!Zq-Integration-Tkn42'
        gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        postgres_exporter['enable'] = false
        redis_exporter['enable'] = false
        gitlab_exporter['enable'] = false
        registry['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 5
    shm_size: "256m"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8929/-/readiness"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # CI runner for waiter integration tests — opt-in via --profile ci.
  # Uses the shell executor so jobs run directly in this container with no
  # docker-in-docker / socket-mount complexity. Registered against the
  # GitLab service by scripts/register_runner.py after GitLab is ready.
  gitlab-runner:
    image: gitlab/gitlab-runner:${GITLAB_RUNNER_VERSION:-alpine-v19.4.0}
    container_name: tests-gitlab-runner
    depends_on:
      gitlab:
        condition: service_healthy
    networks:
      default: {}
    extra_hosts:
      # Lets the runner reach gitlab on the same URL the host uses so that
      # `external_url 'http://localhost:8929'` resolves consistently.
      - "localhost:host-gateway"
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
    restart: unless-stopped
    profiles:
      - ci

  heptapod:
    # `octobus/heptapod` stopped past 17.0.6; the live image lineage moved
    # to `heptapod/heptapod` on Hub. Pin to a concrete tag so CI is
    # reproducible; bump when a newer minor lands.
    image: heptapod/heptapod:${HEPTAPOD_VERSION:-18-7-latest}
    hostname: heptapod.test
    ports:
      - "8930:80"
    environment:
      GITLAB_ROOT_EMAIL: admin@example.com
      GITLAB_ROOT_PASSWORD: X9!Zq-Integration-Tkn42
    profiles:
      - heptapod
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/-/readiness"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

volumes:
  gitlab_runner_config: {}
