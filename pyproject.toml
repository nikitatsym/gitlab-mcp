[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitlab-mcp"
version = "0.1.0"
description = "MCP server for GitLab and Heptapod — full REST API coverage with VCS-aware helpers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]
keywords = ["mcp", "gitlab", "heptapod", "mercurial", "model-context-protocol", "claude", "ai"]

[project.scripts]
gitlab-mcp = "gitlab_mcp:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live GitLab/Heptapod Docker container (slow)",
]
# Run unit tests by default; integration files are opt-in via the marker.
addopts = "-m 'not integration'"

[tool.ruff]
extend-exclude = [
    "src/gitlab_mcp/_generated.py",
    "src/gitlab_mcp/_generated_groups.py",
]

[tool.ruff.lint]
# F541: f-strings without placeholders are common in generated paths
# F401: unused imports may be intentional re-exports in tests
ignore = ["F541", "F401"]
