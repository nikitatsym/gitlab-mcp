[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitlab-mcp"
version = "0.1.0"
description = "MCP server for GitLab and Heptapod — full REST API coverage with VCS-aware helpers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]
keywords = ["mcp", "gitlab", "heptapod", "mercurial", "model-context-protocol", "claude", "ai"]

[project.scripts]
gitlab-mcp = "gitlab_mcp:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mypy>=1.13.0",
    "types-PyYAML",
    "ruff>=0.6.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live GitLab/Heptapod Docker container (slow)",
]
# Run unit tests by default; integration files are opt-in via the marker.
addopts = "-m 'not integration'"

[tool.ruff]
extend-exclude = [
    "src/gitlab_mcp/_generated.py",
    "src/gitlab_mcp/_generated_groups.py",
]

[tool.ruff.lint]
# F541: f-strings without placeholders are common in generated paths
# F401: unused imports may be intentional re-exports in tests
ignore = ["F541", "F401"]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
# Generated source is checked too. Codegen owns the type shape: if mypy
# rejects something in _generated.py, the fix is in codegen/generate.ts
# or codegen/openApiResolver.ts, not an exclude here.

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gitlab_mcp.tools"
# Overrides shadow names re-exported by `from ._generated import *`. The
# shadowing is intentional (override > generated by design).
disable_error_code = ["no-redef"]
