name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Lint (ruff)
        run: |
          uv tool install ruff
          uv tool run ruff check src/ tests/ scripts/
      - name: Unit tests
        run: uv run pytest tests/ -m 'not integration' -v

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install codegen deps
        working-directory: codegen
        run: npm ci
      - name: Drift check
        working-directory: codegen
        run: npx tsx generate.ts --check

  integration-gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Start GitLab
        run: docker compose -f tests/docker-compose.yml up -d gitlab
      - name: Bootstrap PAT
        run: uv run python scripts/bootstrap.py gitlab
      - name: Integration tests
        run: uv run pytest -m integration tests/test_integration_gitlab.py -v
      - name: Tear down
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v

  release:
    needs: [unit, codegen-drift, integration-gitlab]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Calculate version
        id: version
        run: |
          git fetch --tags
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            echo "version=0.1.0" >> $GITHUB_OUTPUT
          else
            BASE=${LATEST#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            PATCH=$((PATCH + 1))
            echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          fi

      - name: Build wheel
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml
          uv build --wheel --out-dir dist/

      - name: Create tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" dist/*.whl \
            --title "v${VERSION}" \
            --generate-notes \
            --latest

      - name: Generate PEP 503 index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="gitlab-mcp"
          for i in 1 2 3 4 5; do
            gh api repos/${{ github.repository }}/releases --paginate \
              -q '.[].assets[].browser_download_url' | grep -q "${VERSION}" && break
            sleep 3
          done
          mkdir -p _site/simple/${PKG}
          {
            echo "<!DOCTYPE html><html><head><meta name=\"pypi:repository-version\" content=\"1.0\"></head><body>"
            echo "<h1>${PKG}</h1>"
            gh api repos/${{ github.repository }}/releases --paginate -q '.[].assets[].browser_download_url' | while read URL; do
              FNAME=$(basename "$URL")
              echo "<a href=\"${URL}\">${FNAME}</a><br>"
            done
            echo "</body></html>"
          } > _site/simple/${PKG}/index.html
          {
            echo "<!DOCTYPE html><html><body>"
            echo "<a href=\"${PKG}/\">${PKG}</a>"
            echo "</body></html>"
          } > _site/simple/index.html

      - name: Copy docs
        run: cp docs/index.html _site/

      - name: Configure pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to pages
        uses: actions/deploy-pages@v4
