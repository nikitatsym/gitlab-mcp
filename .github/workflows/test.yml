name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "RESEARCH.md"
      - "README.md"
      - "**/*.md"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Lint (ruff)
        run: |
          uv tool install ruff
          uv tool run ruff check src/ tests/ scripts/
      - name: Unit tests
        run: uv run pytest tests/ -m 'not integration' -v

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install codegen deps
        working-directory: codegen
        run: npm ci
      - name: Drift check
        working-directory: codegen
        run: npx tsx generate.ts --check

  integration-gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Start GitLab
        run: docker compose -f tests/docker-compose.yml up -d gitlab
      - name: Bootstrap PAT
        run: uv run python scripts/bootstrap.py gitlab
      - name: Integration tests
        run: uv run pytest -m integration tests/test_integration_gitlab.py -v
      - name: Tear down
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v
