repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        # --force-exclude: pre-commit passes filenames explicitly, and ruff lints
        # an explicitly named file even when extend-exclude lists it, so the
        # generated modules would be checked here but not in CI.
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        pass_filenames: true
        require_serial: false

      # `ruff format` is intentionally NOT wired in: the codebase predates
      # ruff-format and applying it would create a huge unrelated diff.
      # Re-add as a separate task when you're ready to format-sweep.

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        # mypy needs to see the whole package context, so pass the project
        # roots, not just changed files.
        pass_filenames: false
        args: [src/gitlab_mcp, tests, scripts]
        require_serial: true

      - id: codegen-drift
        name: codegen drift check
        entry: bash -c 'cd codegen && npx tsx generate.ts --check'
        language: system
        # Only run when codegen inputs change.
        files: '^(codegen/.*\.(ts|json)|codegen/openapi/openapi_v3\.yaml)$'
        pass_filenames: false
        require_serial: true
